<!--
  /roadmap — ONE address (owner ask 2026-10-02: tracking and Clarity must not
  split /roadmap and /roadmap/).

  Goes FIRST in <head> of the ClickFunnels custom HTML page 25516164 (manifest
  key "slo-297-sales", headBlocks), before the Meta pixel, Clarity and
  fh-attribution.js, so all three only ever see /roadmap.

  Why a script and not a redirect: ClickFunnels serves /roadmap/ (and
  /roadmap//) as a 200 from its own edge, and its API has no redirect setting.
  A custom HTML page also refuses head_code (422), so this rides inside the
  page document the push writes.

  What it does: when the path ends in "/", it rewrites the address bar to the
  same path without it, keeping the query string (UTMs, fbclid, ref,
  client_id, offer) and the #fhw anchor. history.replaceState: no reload, no
  second request, no extra history entry. Every other address is left alone.
-->
<link rel="canonical" href="https://apply.fundhub.ai/roadmap">
<script>
(function(){
  try{
    var l=window.location,p=String(l.pathname||""),c=p.replace(/\/+$/,"");
    if(!c||c===p) return;
    var h=window.history;
    if(!h||typeof h.replaceState!=="function") return;
    h.replaceState(h.state,"",c+l.search+l.hash);
  }catch(e){}
})();
</script>
<!-- fh-canonical:end -->
