<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundhub · Climate front door (mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   MOCK TOKENS — engineers: map these onto fundhub-brand.css.
   Dark surface because the Darwin map is dark. Band colours (--fh-band-*)
   are the live values returned by GET /api/climate, not invented.
   ===================================================================== */
:root{
  --fh-void:#07080A;
  --fh-lift:#0C0E12;
  --fh-panel:rgba(14,16,20,.82);
  --fh-panel-solid:#0E1014;
  --fh-line:rgba(255,255,255,.10);
  --fh-line-2:rgba(255,255,255,.055);
  --fh-ink:#F3F5F8;
  --fh-mute:#8B93A1;
  --fh-dim:#5C6470;
  --fh-band-favorable:#A9C6E8;   /* live: color_band "favorable" */
  --fh-band-neutral:#F2E39B;     /* live: color_band "neutral"   */
  --fh-sans:'Inter',system-ui,-apple-system,sans-serif;
  --fh-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --fh-r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#000;color:var(--fh-ink);
  font-family:var(--fh-sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

/* ── mock-only chrome. Delete this block and .mockbar markup for production ── */
.mockbar{
  position:sticky;top:0;z-index:99;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:9px 12px;background:#101317;border-bottom:1px solid var(--fh-line);
}
.mockbar b{font:500 10px/1 var(--fh-mono);letter-spacing:.14em;color:var(--fh-dim);margin-right:6px}
.mockbar button{
  border:1px solid var(--fh-line);background:transparent;color:var(--fh-mute);
  border-radius:99px;padding:5px 11px;font-size:11.5px;cursor:pointer
}
.mockbar button[aria-pressed="true"]{background:var(--fh-ink);color:#000;border-color:var(--fh-ink)}
.mockbar .sep{flex:1}
.mockbar em{font:400 10.5px/1 var(--fh-mono);color:var(--fh-dim);font-style:normal;margin-right:10px}
/* ─────────────────────────────────────────────────────────────────────────── */

.stage{
  container-type:inline-size;
  margin:0 auto;background:var(--fh-void);min-height:100vh;position:relative;overflow:hidden;
  transition:max-width .25s ease;
}
.stage[data-w="mobile"]{max-width:390px;border-left:1px solid var(--fh-line);border-right:1px solid var(--fh-line)}

/* ── map canvas ── */
.map{
  position:relative;width:100%;height:46vh;min-height:330px;
  background:
    radial-gradient(70% 90% at 50% 45%, rgba(169,198,232,.10), transparent 72%),
    var(--fh-void);
  border-bottom:1px solid var(--fh-line-2);
  overflow:hidden;
}
/* bottom fade so content scrolling over the map reads as intentional */
.map::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--fh-void));
}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* once a location resolves the globe sits back and the content glasses over it */
.stage[data-loc="1"] .map{opacity:.82}
.map{transition:opacity .9s ease, filter .9s ease}
.pin{fill:var(--fh-band-favorable);opacity:.95}
.pin-halo{fill:var(--fh-band-favorable);opacity:.14}
.you{fill:var(--fh-band-neutral)}
.you-ring{fill:none;stroke:var(--fh-band-neutral);stroke-width:1.2;opacity:.6}
@media (prefers-reduced-motion:no-preference){
  .you-ring{animation:ping 2.6s cubic-bezier(.2,.7,.4,1) infinite}
}
@keyframes ping{0%{r:6;opacity:.65}70%{r:26;opacity:0}100%{opacity:0}}
.maplabel{
  position:absolute;left:14px;bottom:12px;display:flex;gap:8px;align-items:center;
  font:500 10.5px/1 var(--fh-mono);letter-spacing:.09em;color:var(--fh-dim);z-index:3;
}
.maplabel i{width:6px;height:6px;border-radius:99px;background:var(--fh-band-favorable);display:inline-block;font-style:normal}

/* ── shell ── */
.shell{padding:22px 18px 72px;max-width:640px;margin:0 auto}
.brand{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;pointer-events:none;
}
.brand .wordmark{font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand .count{font:400 10.5px/1 var(--fh-mono);color:var(--fh-dim);letter-spacing:.06em}

h1{
  font-size:29px;line-height:1.1;letter-spacing:-.033em;font-weight:700;
  margin:0 0 12px;max-width:17ch;
}
.lede{font-size:14.5px;line-height:1.55;color:var(--fh-mute);margin:0 0 20px;max-width:58ch}
h2{font-size:17px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin:0}
h3{font-size:13px;font-weight:600;margin:0 0 9px}

/* ── form ── */
.panel{
  background:var(--fh-panel);border:1px solid var(--fh-line);border-radius:var(--fh-r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px;
}
.panel + .panel{margin-top:12px}
label{display:block;font-size:11.5px;font-weight:600;margin:13px 0 6px;color:var(--fh-ink)}
label:first-child{margin-top:0}
input[type=text],input[type=date],input[type=month],input:not([type]){
  width:100%;padding:11px 12px;border:1px solid var(--fh-line);border-radius:8px;
  background:rgba(255,255,255,.035);font-size:15px; /* 15px+ stops iOS zoom-on-focus */
  min-height:44px;
}
input::placeholder{color:var(--fh-dim)}
input:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--fh-band-favorable);outline-offset:2px
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11.5px;line-height:1.5;color:var(--fh-dim);margin:6px 0 0}

.btn{
  width:100%;min-height:48px;border:0;border-radius:9px;background:var(--fh-ink);color:#000;
  font-weight:700;font-size:14px;cursor:pointer;margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{background:#fff}
.btn-ghost{
  background:transparent;border:1px solid var(--fh-line);color:var(--fh-ink);
  font-weight:600;font-size:12.5px;min-height:42px;margin-top:9px
}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-sm{width:auto;min-height:34px;padding:0 13px;font-size:12px;margin:0;border-radius:7px}

/* ── lender rows ── */
.matchhead{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  margin:0 0 12px;padding:0 2px
}
.matchhead .n{font:500 11px/1 var(--fh-mono);color:var(--fh-mute);letter-spacing:.07em;white-space:nowrap}
.lenders{display:flex;flex-direction:column;gap:8px}
.lender{
  display:flex;gap:12px;align-items:center;
  border:1px solid var(--fh-line);border-radius:var(--fh-r);
  background:rgba(12,14,18,.80);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px;
}
.logo{
  flex:0 0 38px;height:38px;border-radius:7px;border:1px solid var(--fh-line);
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
  font:600 12px/1 var(--fh-sans);color:var(--fh-mute);overflow:hidden
}
.logo img{width:100%;height:100%;object-fit:contain;padding:5px;background:#fff}
.lmeta{min-width:0;flex:1}
.lname{font-weight:600;font-size:14px;line-height:1.25;letter-spacing:-.01em}
.lprod{font-size:12px;line-height:1.4;color:var(--fh-mute);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{
  font:400 10px/1 var(--fh-mono);letter-spacing:.05em;color:var(--fh-dim);
  border:1px solid var(--fh-line-2);border-radius:99px;padding:4px 7px
}
.lgo{flex:0 0 auto}
.lgo a{
  display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:7px;
  border:1px solid var(--fh-line);font-size:12px;font-weight:600;text-decoration:none
}
.lgo a:hover{background:rgba(255,255,255,.06)}

/* ── gated remainder ── */
.gate{position:relative;margin-top:8px;border-radius:var(--fh-r);overflow:hidden}
.gate .lenders{filter:blur(7px);opacity:.5;pointer-events:none;user-select:none;padding:8px 0}
.gate .scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,8,10,.15) 0%,rgba(7,8,10,.86) 46%,var(--fh-void) 100%);
}
.gate .unlock{
  position:absolute;left:0;right:0;bottom:0;padding:16px;text-align:center;
}
.gate .unlock p{margin:0 0 4px;font-size:14.5px;font-weight:600}
.gate .unlock .sub{font-size:12.5px;font-weight:400;color:var(--fh-mute);margin-bottom:12px}

/* ── consent + totals ── */
.disc{
  font-size:12px;line-height:1.55;color:var(--fh-mute);
  max-height:132px;overflow-y:auto;border:1px solid var(--fh-line-2);border-radius:8px;
  padding:11px;background:rgba(0,0,0,.25)
}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
.agree input{width:19px;height:19px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--fh-band-favorable)}
.agree span{font-size:12.5px;line-height:1.5}
.biz{border:1px dashed var(--fh-line);border-radius:9px;padding:13px;margin-top:11px;background:rgba(0,0,0,.2)}
.bizhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.bizhead strong{font-size:12px}
.bizrm{border:0;background:transparent;color:var(--fh-dim);font-size:11px;font-weight:600;cursor:pointer;padding:4px}
.total{
  margin-top:14px;padding:13px;border-radius:9px;border:1px solid var(--fh-line);
  background:rgba(255,255,255,.035);display:flex;justify-content:space-between;align-items:baseline;gap:10px
}
.total .lbl{font-size:12.5px;color:var(--fh-mute)}
.total .amt{font:500 19px/1 var(--fh-mono);letter-spacing:-.02em}

.trust{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.trust li{list-style:none;font-size:11.5px;line-height:1.45;color:var(--fh-mute);padding-left:15px;position:relative}
.trust li::before{
  content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:99px;
  background:var(--fh-band-favorable);opacity:.8
}

.ok{border:1px solid rgba(169,198,232,.35);background:rgba(169,198,232,.09);border-radius:var(--fh-r);padding:16px}
.ok h2{margin-bottom:7px}
.ok p{margin:0;font-size:13.5px;line-height:1.55;color:var(--fh-mute)}

.legal{margin-top:26px;font-size:10.5px;line-height:1.6;color:var(--fh-dim);max-width:62ch}
.legal p{margin:0 0 7px}

.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:2px;background:var(--fh-line);border-radius:99px;font-style:normal}
.steps i.on{background:var(--fh-band-favorable)}

/* ── desktop: form floats over the map, results rail beside it ── */
@container (min-width:900px){
  .map{position:absolute;top:0;left:0;right:0;height:118vh;min-height:0;border:0}
  .map::after{height:22%}
  /* left scrim: the map fades out under the floating form column */
  .stage::before{
    content:"";position:absolute;top:0;left:0;width:46%;height:100vh;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,var(--fh-void) 0%,rgba(7,8,10,.94) 42%,transparent 100%);
    transition:height .9s ease, width .9s ease;
  }
  /* globe has moved low-left by now, so the scrim pulls back to the headline */
  .stage[data-loc="1"]::before{
    width:100%;height:50vh;
    background:linear-gradient(180deg,var(--fh-void) 0%,rgba(7,8,10,.88) 60%,transparent 100%);
  }
  .shell{
    position:relative;z-index:2;max-width:1280px;min-height:100vh;
    display:grid;grid-template-columns:minmax(360px,420px) 1fr;
    gap:34px;align-items:start;padding:92px 40px 56px;
  }
  .col-left{position:sticky;top:92px}
  h1{font-size:40px;max-width:15ch}
  .lede{font-size:15px}
  .col-right:empty{display:none}
}
@container (max-width:899px){
  .col-right{margin-top:20px}
}
</style>
</head>

/* ── projection: identical maths to darwin-source/lib/projection.js ── */
function projectPoint(lat,lng,w,h){
  var minLng=-125,maxLng=-66,minLat=24,maxLat=50;
  return { x:((lng-minLng)/(maxLng-minLng))*w, y:h-((lat-minLat)/(maxLat-minLat))*h };

/* =======================================================================

   then the camera flies to it and stays there while the content glasses

   LAND is a 1.25-degree land/ocean bitmask rasterised from Natural Earth
   ne_110m_land, base64-packed. 6.9 KB, no network call, no library.
   ======================================================================= */
var LAND_NX=288, LAND_NY=144, LAND_STEP=1.25;
var LAND_B64="////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////98AAf//////////////////////////////////////////8AAAH////////////v/////////////////////////////wAAAAH///////////8AfP//////////////////////////8AAAAAAP/////////4PB+AA/////////////////////////wAAAAOA/////////8AAAfgc/////////////////////////4AAAAA///////////AAAHAP//////////////////////////AAAAAAf////////8AAAAAAf////////////////////////+AAAAAAH//////////gAAAAAP///////////////////////+AAAAAAAApAfAH////+AAAAAA////////////////////////gAAAAAAAAAAAeAwAD+AAAAAA////////////////////////8AAAAAAAAAAAMAAA++AAAAAAH//////////H////////////+AAAAAAAAAAAAAAAG8AAAAAAAADz///////B///////////8AAAAAAAAAAAAAAAAF8AAAAAAAAAAAAPP///wP/////////+AAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAA///gD////////8AAAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAB8AAACAPn8f/zwAAAAAAAAAAAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+BwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/AAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAA/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAeAAAAAAAAAAAAAAA/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAAAAAAAAAAAAAAAPwAAAAAAAAAAAAAAAAAAAAAAAAAAAEAADAAAAAAAAAAAAAAAfwAAAAAAAAAAAAAAAAAAAAAAAAAAAOAABgAAAAAAAAAAAAAAf8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAAAAAAAAAAAf8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAcAAAAAAAAAAAAAAf/wAAAAAAAAAAAAAAAAAAAAAAAAAB8AAAOAAAAAAAAAAAAAAP/4AAAAAAAAAAAAAAAAAAAAAAAAAD/AAAIAAAAAAAAAAAAAAP/wAAAAAAAAAAAAAAAAAAAAAAAAAH/AAAQAAAAAAAAAAAAAAP/uAAAAAAAAAGAAAAAAAAAAAAPAAv/gAAAAAAAAAAAAAAAAAH//AAAAAAAAAH8AAAAAAAAAAAH4A//gAAAAAAAAAAAAAAAAAH//gAAAAAAAAH+AAAAAAAAAAAH/j//wAAAAAAAAAAAAAAAAAH//wAAAAAAAAP/AAAAAAAAAAAP////wAAAAAAAAAAAAAAAAAH//wAAAAAAAAf/gAAAAAAAAAAP////4AAAAAAAAAAAAAAAAAH//4AAAAAAAAf/wAAAAAAAAAAf////4AAAAAAAAAAAAAAAAAH//4AAAAAAAA//wAAAAAAAAAAf////4AAAAAAAAAAAAAAAAAH//4AAAAAAAA//wAAAAAAAAAAf////wAAAAAAAAAAAAAAAAAD//8AAAAAAAA//8BwAAAAAAAAf////wAAAAAAAAAAAAAAAAAD///gAAAAAAA//8BwAAAAAAAAf////gAAAAAAAAAAAAAAAAAD///4AAAAAAB//8BwAAAAAAAAP////AAAAAAAAAAAAAAAAAAD///8AAAAAAB//8B4AAAAAAAAD///+ABAAAAAAAAAAAAAAAAD///8AAAAAAD//8A4AAAAAAAAAf//8AAAAAAAAAAAAAAAAAAH///8AAAAAAH//+B8AAAAAAAAAP//4AAACAAAAAAAAAAAAAAP///+AAAAAAH///h8AAAAAAAAAP/54AAAAAAAAAAAAAAAAAA////+AAAAAAH///wcAAAAAAAAAH/hwAAQAAAAAAAAAAAAAAB////+AAAAAAD///4MAAAAAAAAABPhwAAAAAAAAAAAAAAAAAB////+AAAAAAD///wEAAAAAAAAAAPhgAAAAAAAAAAAAAAAAAD/////AAAAAAB///wAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAD/////gAAAAAB///wAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAH/////wAAAAAD///wAAAAAAAAAAEAACAAAAAAAAAAAAAAAAAH/////wAAAAAD///gAAAAAAAADwAAPmAQAAAAAAAAAAAAAAAP/////wAAAAAD///wAAAAAAAAfAAAH8DAAAAAAAAAAAAAAAAf/////wAAAAAD///gAAAAAAAAgAAAP5gAAAAAAAAAAAAAAAAf/////AAAAAAH///wAAAAAAADgAQA/wQAAAAAAAAAAAAAAAAP////8AAAAAAP///wAAAAAAAHh5QzfAQAAAAAAAAAAAAAAAAf////AAAAAAAf///4AAAAAAAHD5gCIAAAAAAAAAAAAAAAAAAP///4AAAAAAAf///8AAAAAAAOH8AiAAAAAAAAAAAAAAAAAAAP///wAAAAAAAP///+AAAAAAAcH88gAAAAAAAAAAAAAAAAAAAH///wAAAAAAAP////AAAAAAAeB8AAAAAAAAAAAAAAAAAAAAAD///gAAAAAAAP////gAAAAAA2A8AAAAAAAAAAAAAAAAAAAAAD///gAAAAAABf////wAAAAABuAeAAAAAAAAAAAAAAAAAAAAAD//+AAAAAD/D/////4AAAAAAMAGAAAAAAAAAAAAAAAAAAAAAD//gAAAAAH///////8AAACAAIAEEAAAAAAAAAAAAAAAAAAAAX//gAAAAAP///////8AAACAAQAAOAAAAAAAAAAAAAAAAAAABJ/+AAAAAAf///////8AAAaAAAgCKAAAAAAAAAAAAAAAAAAAGA+EAAAAAA///////++AAAcAARwBIAAAAAAAAAAAAAAAAAAAGAIAAAAAAB///////8CAAA8AAT4AAAAAAAAAAAAAAAAAAAAAOAAAAAAAAB///////9AAAA8AAX4AgAAAAAAAAAAAAAAAAAAD+AAAAAAAAD///////74AAA8AA/4AAAAAAAAAAAAAAAAAAAAH+AAAAAAAAB///////z/AAB8AA/4AgAAAAAAAAAAAAAAAAAD/gAAAAAAAAB///////j/gAB/AD/wAwAAAAAAAAAAAAAAAAAP/wGIgAAAAAB///////n/4AD/gH/gAwAAAAAAAAAAQAAAAAA/hwAMAAAAAAB///////H/8AD/wH/mAAAAAAAAAAAAAAAAAAA/AwDAAAAAAAB///////P/+AD/8P/gAAAAAAAAAAAAAAAAAAA/ACMAAAAAAAD///////f//AP/+P//AAAAAAAAAAAAAAAAAAB/AAgAAAAAAAB//////8f/+Af/////4gAAAAAAAAAAAAAAAAD/AAEAAAAAAAA//////8/+YA//////+gAAAAAAAAAAAAAAAAn/AAQAAAAAAAA//////8/8B////////AAAAAAAAAAAAAAAABP/AAwAAAAAAAAf/////5/8T////////AAAAAAAAAAAAAAAABf/gAwAAAAAAAAP/////z/5/////////gAAAAAAAAAAAAAAAC//xhgAAAAAAAAD///////z/////////wAAAAAAAAAAAAAAAE////gAAAAAAAAD///7/////////////gAAAAAAAAAAAAAAAH////gAAAAAAAAD///DwD///////////gIAAAAAAAAAAAAAAP////4AAAAAAAAB//4AAD///////////gOAAAAAAAAAAAAAA/////8AAAAAAAAAf/wAAB///////////AGwAAAAAAAAAAAAB/////+AAAAAAAAAR/4AAB///////////BxcAAAAAAAAAAAAD/////+AAAAAAAAAcB4BD////////////xweAAAAAAAAAAAAD//////AAAAAAAAB/AABn///////////8DgGAAAAAAAAAAAAH//////AAAAAAAAD/AQTn///////////+TADAAAAAAAAAAAAH//////gAAAAAAAB/gQ3l////////////vgCAAAAAAAAAAAAH//////8AAAAAAAB/wXn8MH///////////wCAAAAAAAAAAAAP//////8AAAAAAAB/4OP8AP///////////+DwAAAAAAAAAAAH///////YAAAAAAAB/8/+Af////////////hgAAAAAAAAAAAH////////AAAAAAAB/9//M/////////////wAAAAAAAAAAAAH///////xBAAAAAAD/////f////////////4gAAAAAAAAAAAL//////9wfAAAAAAP//////////////////8AAAAAAAAAAAAX///////EeAAAAAAB//////////////////8wAAAAAAAAAABf////////IAAAAAAOf/////////////////8gAAAAAAAAAAA//////n//4AAAAADPn//////////////////gBgAAAAAAAAB//////H//4AAAAABvD//////////////////ABwAAAAAAAAD//////P//wAAAAABnAYf///////////////wABwAAAAMAAAP/////4D//AAAAAAAOA2B///////////////gAD8AAAABgAAP/////gB/+AAAAAAAcATh///////////////4AB8AAAAA4AAf////8AD/8AAAAAAAIAHgP//////////////+AAcAAAAP5AP/////wAD8YAAAAAAAAD/4f///////////////+cOAAAA/9n//////wAD8AABwAAAAAD/x/////////////////8D+AAB/////////4ADwAAPwAAAAAD/x//////////////////9/wAIv////////+AAHQAfwAAAAAA/5////////////////////+BAH/////////3jfwA/4AAfAAAP+f8//////////////////8fj//////////8AfMA/+AB/AAAD/P8P///////////////////gP//////////Af8B//4AAAAAB///5v//9//////////////wB//////8HBvnBfgB//+AAAAAA///xh//+//////////////AAf//4//H/zvDh/ABf//8AAAAAH/4AAA49////////////7+AAD8AAAAP/gcf/8AD///9AAAAAAfAAAAB8///////////wAAAAAAAAAff7Dg//AAD////AAAAAAAAABwAdf//////gD/AAAAAAAAAAAP2HHe7uAAD///+AAAAAAAAAAYAAD////+HgAAAAAAAAAAAAAGAAAAAAAAP////wAAAAAAAAAOAAAH//8AAAAAAAAAAAAAAAAAPmPDjgAAf////wAAAAAAAAAD4AAA///gAAPwAAAAAAAAAAAB4AA4/8H//////wAAAAwAAAAAAgAAAHwAAAAAAAAAAAAAAAAAAAFgH+f//////wAAAD5gAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAP7/Af/////4AAAH8AAAAAAAAAHwAAAAAAAAAAAAAAAAAAAAAff/8f/////+AAAAAgAA+AAAAAPgAAAAAAAAAAAAAAAAAAAAAB///x/+//9BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAO+AAAf/+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
var LAND_BITS=(function(){
  var raw=atob(LAND_B64), u=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) u[i]=raw.charCodeAt(i);
  return u;
})();
function isLand(lat,lng){
  var ix=Math.floor((lng+180)/LAND_STEP), iy=Math.floor((lat+90)/LAND_STEP);
  if(ix<0||ix>=LAND_NX||iy<0||iy>=LAND_NY) return false;
  var i=iy*LAND_NX+ix;
  return (LAND_BITS[i>>3]>>(7-(i&7)))&1;
}

var RAD=Math.PI/180;
/* even dot spacing on the sphere: longitude samples scale with cos(lat), so
   the poles do not clump the way an equirectangular grid makes them */
function dotField(SP, latMin, latMax, lngMin, lngMax){
  var d=[];
  for(var lat=latMin; lat<=latMax; lat+=SP){
    var n=Math.max(4, Math.round(360*Math.cos(lat*RAD)/SP));
    for(var k=0;k<n;k++){
      var lng=-180+(k+0.5)*360/n;
      if(lng<lngMin||lng>lngMax) continue;
      if(!isLand(lat,lng)) continue;
      d.push(Math.sin(lat*RAD), Math.cos(lat*RAD), lng*RAD);
    }
  }
  return new Float64Array(d);
}
/* Level of detail: the whole globe stays coarse, and a finer North America
   layer fades in as the camera closes, so the dots never thin out into noise. */
var DOTS      = dotField(1.9, -84, 84, -180, 180);
var DOTS_FINE = dotField(0.8,  13, 62, -142, -50);

var AZ_BOX={lng:[-114.6,-109.3], lat:[31.5,36.8]};
var METROS=[[-74.0,40.7],[-87.6,41.9],[-95.4,29.8],[-122.4,37.8],[-84.4,33.7],[-104.9,39.7],
            [-122.3,47.6],[-80.2,25.8],[-93.3,44.9],[-71.1,42.4],[-96.8,32.8],[-83.0,39.96],
            [-90.2,38.6],[-86.8,36.2],[-112.1,33.45],[-115.1,36.2],[-77.0,38.9],[-81.4,28.5]];
function rnd(i){ var x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

/* national lender field, fixed seed so it never reshuffles between renders */
var NATIONAL=(function(){
  var p=[];
  for(var i=0;i<150;i++){
    var lo=-124+rnd(i)*57, la=25+rnd(i+900)*24;
    if(isLand(la,lo)) p.push([lo,la]);
  }
  return p;
})();
var AZ_PINS=(function(){
  var p=[];
  for(var k=0;k<12;k++){
    p.push([ AZ_BOX.lng[0]+0.4+rnd(k*3+7)*(AZ_BOX.lng[1]-AZ_BOX.lng[0]-0.8),
             AZ_BOX.lat[0]+0.4+rnd(k*5+23)*(AZ_BOX.lat[1]-AZ_BOX.lat[0]-0.8) ]);
  }
  return p;
})();

/* fx/fy are the globe centre as a fraction of the container. Wide: right of
   the form, the hero. Close: low-left, the one area the lender list leaves
   free, so their own state stays visible while the globe sweeps behind. */
var WIDE ={lat:39.0,     lng:-98.0,    zoom:1.00, fx:0.655, fy:0.46};
var CLOSE={lat:DEMO.lat, lng:DEMO.lng, zoom:1.72, fx:0.290, fy:0.60};
var cam={lat:WIDE.lat, lng:WIDE.lng, zoom:WIDE.zoom, fx:WIDE.fx, fy:WIDE.fy};
var camFrom=null, camTo=null, camT0=0, CAM_MS=1500, raf=null, pinFade=0;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function project(sLat,cLat,lngRad,c){
  var dl=lngRad-c.lngRad, cd=Math.cos(dl);
  var cosc=c.s0*sLat + c.c0*cLat*cd;
  if(cosc<=0.015) return null;
  return { x:c.cx + c.R*cLat*Math.sin(dl),
           y:c.cy - c.R*(c.c0*sLat - c.s0*cLat*cd),
           d:cosc };
}
function camCtx(w,h,desktop){
  var base=Math.min(w,h)*(desktop?0.46:0.44);
  return {
    s0:Math.sin(cam.lat*RAD), c0:Math.cos(cam.lat*RAD), lngRad:cam.lng*RAD,
    R:base*cam.zoom,
    cx: desktop ? w*cam.fx : w*0.50,
    cy: desktop ? h*cam.fy : h*0.47
  };
}

function paintGlobe(){
  var el=document.getElementById('map'), cv=document.getElementById('globe');
  var w=el.clientWidth, h=el.clientHeight; if(!w||!h) return;
  var dpr=Math.min(window.devicePixelRatio||1, 2);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);

  var desktop=document.getElementById('stage').clientWidth>=900;
  var c=camCtx(w,h,desktop);
  var located=STATE.step!=='locate';

  /* sphere body — the limb is what makes it read as 3-D rather than flat */
  var grd=g.createRadialGradient(c.cx-c.R*0.35, c.cy-c.R*0.4, c.R*0.1, c.cx, c.cy, c.R);
  grd.addColorStop(0,'rgba(169,198,232,.055)');
  grd.addColorStop(0.72,'rgba(169,198,232,.018)');
  grd.addColorStop(1,'rgba(7,8,10,0)');
  g.beginPath(); g.arc(c.cx,c.cy,c.R,0,6.2832); g.fillStyle=grd; g.fill();
  g.beginPath(); g.arc(c.cx,c.cy,c.R,0,6.2832);
  g.strokeStyle='rgba(169,198,232,.13)'; g.lineWidth=1; g.stroke();

  /* land dots, bucketed by depth so the far side falls away */
  var buckets=[[],[],[],[]];
  function plot(F,gain){
    for(var i=0;i<F.length;i+=3){
      var p=project(F[i],F[i+1],F[i+2],c);
      if(!p) continue;
      if(p.x<-40||p.x>w+40||p.y<-40||p.y>h+40) continue;
      var lg=F[i+2]/RAD, la=Math.asin(F[i])/RAD;
      var hot = located && p.d>0.2 &&
        lg>AZ_BOX.lng[0]&&lg<AZ_BOX.lng[1]&&la>AZ_BOX.lat[0]&&la<AZ_BOX.lat[1];
      buckets[hot?3:(p.d>0.72?0:(p.d>0.4?1:2))].push(p.x,p.y,gain);
    }
  }
  plot(DOTS,1);
  /* fine layer fades in past zoom 1.2 so close-ups keep their density */
  var fine=Math.max(0,Math.min(1,(cam.zoom-1.15)/0.45));
  if(fine>0.01) plot(DOTS_FINE,fine);

  var styles=[[169,198,232,.44,1.35],[169,198,232,.28,1.15],
              [169,198,232,.14,0.95],[242,227,155,.72,1.85]];
  for(var b=0;b<4;b++){
    var arr=buckets[b]; if(!arr.length) continue;
    var st=styles[b], r=st[4]*Math.min(1.45,0.85+cam.zoom*0.22), lastA=-1;
    for(var k=0;k<arr.length;k+=3){
      var al=st[3]*arr[k+2];
      if(al!==lastA){ if(lastA>=0) g.fill(); g.fillStyle='rgba('+st[0]+','+st[1]+','+st[2]+','+al.toFixed(3)+')'; g.beginPath(); lastA=al; }
      g.moveTo(arr[k]+r,arr[k+1]); g.arc(arr[k],arr[k+1],r,0,6.2832);
    }
    g.fill();
  }

  /* lender pins */
  function pin(lng,lat,rad,alpha,halo){
    var p=project(Math.sin(lat*RAD),Math.cos(lat*RAD),lng*RAD,c); if(!p) return;
    var a=alpha*Math.min(1,p.d*1.5);
    if(halo){ g.beginPath(); g.arc(p.x,p.y,rad*3.1,0,6.2832); g.fillStyle='rgba(169,198,232,'+(a*0.16)+')'; g.fill(); }
    g.beginPath(); g.arc(p.x,p.y,rad,0,6.2832); g.fillStyle='rgba(169,198,232,'+a+')'; g.fill();
  }
  if(!located){
    for(var n=0;n<NATIONAL.length;n++) pin(NATIONAL[n][0],NATIONAL[n][1],2.0,0.55,false);
  } else {
    for(var m=0;m<METROS.length;m++) pin(METROS[m][0],METROS[m][1],2.2,0.40*pinFade,false);
    for(var z=0;z<AZ_PINS.length;z++) pin(AZ_PINS[z][0],AZ_PINS[z][1],3.0*pinFade+1.2,0.95*pinFade,true);
    var u=project(Math.sin(DEMO.lat*RAD),Math.cos(DEMO.lat*RAD),DEMO.lng*RAD,c);
    if(u){
      var t=(Date.now()%2600)/2600;
      if(!REDUCED){
        g.beginPath(); g.arc(u.x,u.y,6+t*26,0,6.2832);
        g.strokeStyle='rgba(242,227,155,'+(0.55*(1-t)*pinFade)+')'; g.lineWidth=1.2; g.stroke();
      }
      g.beginPath(); g.arc(u.x,u.y,5.2,0,6.2832); g.fillStyle='rgba(242,227,155,'+(0.98*pinFade)+')'; g.fill();
    }
  }

  /* status line, parked under the globe */
  var lbl=document.querySelector('.maplabel');
  var by=Math.min(h-18, c.cy+c.R+22);
  if(desktop){ lbl.style.top=Math.round(by)+'px'; lbl.style.bottom='auto'; lbl.style.left=Math.round(Math.max(24,c.cx-c.R))+'px'; }
  else { lbl.style.top=''; lbl.style.bottom=''; lbl.style.left=''; }
  document.getElementById('maplabeltxt').textContent = located
    ? DEMO.stateName.toUpperCase()+' \u00b7 '+MATCHES.length+' MATCHED \u00b7 SOFT PULL ONLY'
    : LENDER_BOOK_COUNT.toLocaleString()+' ACTIVE LENDERS \u00b7 FUNDHUB DATABASE';
}

function ease(t){ return 1-Math.pow(1-t,3); }
function tick(){
  raf=null;
  var now=Date.now(), moving=false;
  if(camTo){
    var t=Math.min(1,(now-camT0)/CAM_MS), e=ease(t);
    cam.lat = camFrom.lat + (camTo.lat-camFrom.lat)*e;
    cam.lng = camFrom.lng + (camTo.lng-camFrom.lng)*e;
    cam.zoom= camFrom.zoom+ (camTo.zoom-camFrom.zoom)*e;
    cam.fx  = camFrom.fx  + (camTo.fx  -camFrom.fx  )*e;
    cam.fy  = camFrom.fy  + (camTo.fy  -camFrom.fy  )*e;
    pinFade = camTo.zoom>1 ? Math.max(0,(e-0.55)/0.45) : 0;
    if(t>=1){ camTo=null; pinFade = cam.zoom>1?1:0; } else moving=true;
  }
  paintGlobe();
  if(moving || (STATE.step!=='locate' && !REDUCED)) raf=requestAnimationFrame(tick);
}

/* drawMap keeps its name — render(), the resize handler and the width toggle
   all still call it. It sets the camera target and lets tick() fly there. */
function drawMap(){
  var stage=document.getElementById('stage');
  var located=STATE.step!=='locate';
  stage.dataset.loc = located ? '1' : '0';
  var target = located ? CLOSE : WIDE;
  var atTarget = Math.abs(cam.lat-target.lat)<0.01 && Math.abs(cam.lng-target.lng)<0.01 && Math.abs(cam.zoom-target.zoom)<0.01;
  if(!atTarget){
    if(REDUCED){ cam={lat:target.lat,lng:target.lng,zoom:target.zoom,fx:target.fx,fy:target.fy}; camTo=null; pinFade=located?1:0; }
    else { camFrom={lat:cam.lat,lng:cam.lng,zoom:cam.zoom,fx:cam.fx,fy:cam.fy}; camTo=target; camT0=Date.now(); }
  } else { pinFade = located?1:0; }
  if(!raf) raf=requestAnimationFrame(tick);
}

        '<input id="dob" name="dob" type="date">'+
        '<label for="address_line1">Street address</label>'+
        '<input id="address_line1" name="address_line1" autocomplete="street-address" placeholder="1200 E Washington St">'+
        '<div class="row2">'+
          '<div><label for="city">City</label><input id="city" name="city" value="'+DEMO.city+'"></div>'+
          '<div><label for="state">State</label><input id="state" name="state" maxlength="2" value="'+DEMO.state+'"></div>'+
        '</div>'+
        '<label for="postal_code">ZIP</label>'+
        '<input id="postal_code" name="postal_code" inputmode="numeric" placeholder="85034">'+
      '</div>'+
      '<div class="panel">'+
        '<h3>Your businesses</h3>'+
        '<p class="hint" style="margin:0 0 4px">Add each business you want funded. Each one adds '+money(PRICING.addon_cents)+
        ' and its own lender matches. Leave this empty if you only want your personal list.</p>'+
        '<div id="bizlist"></div>'+
        '<button class="btn btn-ghost" id="addbiz">Add a business</button>'+
      '</div>'+
      '<div class="panel">'+
        '<h3>Soft pull authorization</h3>'+
        '<div class="disc">'+esc(DISCLOSURE.text)+'</div>'+
        '<p class="hint">Version '+esc(DISCLOSURE.version)+'</p>'+
        '<label class="agree"><input type="checkbox" id="agree"'+(STATE.agreed?' checked':'')+
          '><span>I authorize Fundhub to obtain my credit report as a soft inquiry for this assessment.</span></label>'+
        '<div class="total"><span class="lbl" id="totlbl"></span><span class="amt" id="totamt"></span></div>'+
        '<button class="btn" id="tocheckout">Agree and continue to checkout</button>'+
        '<p class="hint">Complete checkout and your full list opens in your portal.</p>'+
      '</div>';
    renderBiz(); updateTotal();
    document.getElementById('addbiz').onclick=function(){
      if(STATE.businesses.length>=PRICING.max_businesses) return;
      STATE.businesses.push({}); renderBiz(); updateTotal();
    };
    document.getElementById('agree').onchange=function(e){STATE.agreed=e.target.checked;};
    document.getElementById('tocheckout').onclick=function(){
      if(!document.getElementById('agree').checked){ document.getElementById('agree').focus(); return; }
      STATE.step='pay'; render(); window.scrollTo({top:0,behavior:'smooth'});
    };
  }

  else if(STATE.step==='pay'){
    L.innerHTML =
      steps(3)+
      '<h1>One payment opens your full list.</h1>'+
      '<p class="lede">Your authorization is saved. Pay below and the soft pull runs, then your '+DEMO.stateName+
      ' list is written to your portal.</p>'+ legal();
    R.innerHTML =
      '<div class="panel">'+
        '<h3>Order</h3>'+
        '<div class="total"><span class="lbl">Lender match list</span><span class="amt">'+money(PRICING.base_cents)+'</span></div>'+
        (STATE.businesses.length
          ? '<div class="total"><span class="lbl">'+STATE.businesses.length+' additional '+(STATE.businesses.length===1?'business':'businesses')+' × '+money(PRICING.addon_cents)+'</span><span class="amt">'+money(PRICING.addon_cents*STATE.businesses.length)+'</span></div>'
          : '')+
        '<div class="total" style="border-color:rgba(169,198,232,.35);background:rgba(169,198,232,.08)">'+
          '<span class="lbl">Total due today</span><span class="amt">'+money(total())+'</span></div>'+
        '<button class="btn" id="pay">Pay '+money(total())+'</button>'+
        '<p class="hint">Commas checkout embeds here — variable-amount session on the existing '+
        '<strong>Consulting Services Assessment</strong> product. No new SKU is minted.</p>'+
      '</div>'+
      '<div class="panel">'+
        '<h3>What happens after you pay</h3>'+
        '<ul class="trust">'+
          '<li>The soft pull runs. Nothing else is needed from you.</li>'+
          '<li>Your Bank and Lender Match List is written to your portal.</li>'+
          '<li>You apply directly with each lender on your own schedule.</li>'+
        '</ul>'+
      '</div>';
    document.getElementById('pay').onclick=function(){ STATE.step='paid'; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  }

  else if(STATE.step==='paid'){
    L.innerHTML =
      steps(4)+
      '<h1>Your list is in your portal.</h1>'+
      '<p class="lede">All '+MATCHES.length+' '+DEMO.stateName+
      ' lenders, with products and application links, are on your Bank and Lender Match List.</p>'+ legal();
    R.innerHTML =
      '<div class="ok">'+
        '<h2>Payment received — '+money(total())+'</h2>'+
        '<p>Your Bank and Lender Match List is ready. The soft pull runs automatically and the list updates in place as matches change.</p>'+
      '</div>'+
      '<div class="panel">'+
        '<h3>Bank and Lender Match List</h3>'+
        '<p class="hint" style="margin:0 0 12px">Document code <code style="font-family:var(--fh-mono);font-size:11px">bank-lender-match-list</code> · delivered in the customer portal, not by email.</p>'+
        '<a class="btn" href="https://fundhub.ai/app/client-portal.html" style="text-decoration:none">Open your portal</a>'+
      '</div>';
  }

  drawMap();
}

function legal(){
  return '<div class="legal">'+
    '<p>Fundhub is not a direct lender and does not approve credit. Matches are based on state eligibility and product criteria held in the Fundhub lender database. Approval, amounts, rates and terms are decided by each lender.</p>'+
    '<p>No hard inquiry — soft pull only for the assessment.</p>'+
  '</div>';
}

function renderBiz(){
  var box=document.getElementById('bizlist'); if(!box) return;
  box.innerHTML=STATE.businesses.map(function(b,i){
    return '<div class="biz">'+
      '<div class="bizhead"><strong>Business '+(i+1)+'</strong><button class="bizrm" data-rm="'+i+'">Remove</button></div>'+
      '<label for="biz_name_'+i+'">Business name</label><input id="biz_name_'+i+'">'+
      '<label for="biz_line1_'+i+'">Business street address</label><input id="biz_line1_'+i+'">'+
      '<div class="row2">'+
        '<div><label for="biz_city_'+i+'">City</label><input id="biz_city_'+i+'"></div>'+
        '<div><label for="biz_state_'+i+'">State</label><input id="biz_state_'+i+'" maxlength="2" placeholder="AZ"></div>'+
      '</div>'+
      '<label for="biz_zip_'+i+'">ZIP</label><input id="biz_zip_'+i+'" inputmode="numeric">'+
      '<label for="biz_ein_'+i+'">EIN</label><input id="biz_ein_'+i+'" inputmode="numeric" placeholder="12-3456789">'+
      '<label for="biz_inc_'+i+'">When was this business incorporated?</label><input id="biz_inc_'+i+'" type="month">'+
      '<label for="biz_owner_'+i+'">Extra owner name, if any</label><input id="biz_owner_'+i+'">'+
    '</div>';
  }).join('');
  box.querySelectorAll('[data-rm]').forEach(function(b){
    b.onclick=function(){ STATE.businesses.splice(Number(b.getAttribute('data-rm')),1); renderBiz(); updateTotal(); };
  });
}

function updateTotal(){
  var l=document.getElementById('totlbl'), a=document.getElementById('totamt'); if(!l) return;
  var n=STATE.businesses.length;
  l.textContent = n ? money(PRICING.base_cents)+' list + '+n+' × '+money(PRICING.addon_cents) : money(PRICING.base_cents)+' list';
  a.textContent = money(total());
}

/* mock chrome wiring */
document.querySelectorAll('.mockbar [data-step]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.mockbar [data-step]').forEach(function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true'); STATE.step=b.dataset.step; render();
  };
});
document.querySelectorAll('.mockbar [data-w]').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.mockbar [data-w]').forEach(function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');
    document.getElementById('stage').dataset.w=b.dataset.w;
    setTimeout(drawMap,300);
  };
});
document.getElementById('brandcount').textContent=LENDER_BOOK_COUNT.toLocaleString()+' lenders';
window.addEventListener('resize',drawMap);
render();
</script>
</body>
</html>
