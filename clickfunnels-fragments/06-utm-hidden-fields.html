<!--
  06-utm-hidden-fields.html — paste into a Custom HTML/JS element on EVERY
  step of the two live funnels (a third funnel is coming; do not invent it).
  One fragment, no styling, no visible output.

  Live paste URLs:
    (A) apply funnel — https://apply.fundhub.ai/watch
                       https://apply.fundhub.ai/apply
                       https://apply.fundhub.ai/funding-book-call
                       https://apply.fundhub.ai/thank-you
    (B) $297 diagnostic — already on fundhub.ai /roadmap/ and /roadmap/pay.html
      (script: /funnel/fh-attribution.js). CF paste of slo-01/02/03 loads the
      same script from https://fundhub.ai/funnel/fh-attribution.js

  If the page fragment already loads /funnel/fh-attribution.js, do not paste
  this file a second time.

  What it does. Reads the five UTMs off the page URL the person arrived on
  (utm_source, utm_medium, utm_campaign, utm_content, utm_term), keeps them in
  sessionStorage so they survive the click from the VSL page to the form, and
  copies them into hidden inputs on every ClickFunnels form on the page. CF
  then posts them in the webhook as contact.custom_attributes.utm_* and the
  CRM stores them (db/migrations/286_client_ad_attribution.sql).

  Also captures affiliate referral codes a1 / a2 (and ?ref= / ?code= as a1) so
  AF-02 can attribute the lead. Same first-touch rule as the UTMs.

  The wire format (owner-set 2026-09-03):
    utm_source   = fb
    utm_medium   = paid
    utm_campaign = lane        funding600 | premium | sorting | uwiq | wl
    utm_content  = ad id       number-slug: 16-phase, 26-underwriter, 42-ringlights
    utm_term     = variant     sun | nosun | sedona

  Example ad URL:
    https://apply.fundhub.ai/apply?utm_source=fb&utm_medium=paid&utm_campaign=funding600&utm_content=42-ringlights&utm_term=sun

  Never keeps fbclid or any click id. First touch wins: a value already saved
  in sessionStorage is not overwritten by a later page view without UTMs.

  In ClickFunnels, hidden inputs are matched to a contact custom attribute by
  their `name`. Create these five custom attributes once in the workspace
  (Contacts → Settings → Custom attributes) with exactly these names:
    utm_source, utm_medium, utm_campaign, utm_content, utm_term
  and two more, optional but useful: landing_path, referrer_domain.
  Plus affiliate codes (required for referral pay): a1, a2.
-->
<script>
(function () {
  var KEYS = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"];
  var EXTRA = ["landing_path", "referrer_domain"];
  /* Affiliate referral codes. Same names AF-02 and the ClickFunnels adapter
     read (a1 / a2). ?ref= and ?code= mean a1 — share links use all three.
     Kept off ATTRIBUTION_KEYS on purpose: that list is ad UTMs only. */
  var AFF = ["a1", "a2"];
  var STORE = "fh_attribution";

  function read() {
    try { return JSON.parse(sessionStorage.getItem(STORE) || "{}") || {}; } catch (e) { return {}; }
  }
  function save(o) {
    try { sessionStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {}
  }

  // 1. Capture from the URL, once, first touch wins.
  var saved = read();
  var qs = new URLSearchParams(location.search);
  var seen = false;
  KEYS.forEach(function (k) {
    var v = (qs.get(k) || "").trim();
    if (v && !saved[k]) { saved[k] = v.slice(0, 200); seen = true; }
  });
  var a1 = (qs.get("a1") || qs.get("ref") || qs.get("code") || "").trim();
  if (a1 && !saved.a1) { saved.a1 = a1.slice(0, 64); seen = true; }
  var a2 = (qs.get("a2") || "").trim();
  if (a2 && !saved.a2) { saved.a2 = a2.slice(0, 64); seen = true; }
  if (seen || !saved.landing_path) {
    if (!saved.landing_path) saved.landing_path = location.pathname;
    if (!saved.referrer_domain && document.referrer) {
      try { saved.referrer_domain = new URL(document.referrer).hostname; } catch (e) {}
    }
  }
  save(saved);

  // 2. Stamp hidden inputs on every form. Re-run when CF re-renders the form.
  function ensure(form, name, value) {
    var el = form.querySelector('input[name="' + name + '"]');
    if (!el) {
      el = document.createElement("input");
      el.type = "hidden";
      el.name = name;
      form.appendChild(el);
    }
    if (value && !el.value) el.value = value;
  }
  function stamp() {
    var data = read();
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i++) {
      KEYS.concat(EXTRA).concat(AFF).forEach(function (k) { ensure(forms[i], k, data[k] || ""); });
    }
  }
  stamp();
  if (document.readyState !== "complete") window.addEventListener("load", stamp);
  var tries = 0;
  var t = setInterval(function () { stamp(); if (++tries > 20) clearInterval(t); }, 500);

  // /roadmap only. Step 1 (name, email, phone) is saved when the email is
  // real, even if they never press Pay. Pressing Pay tells Meta, unless this
  // browser or this email is one of us. Rules match src/slo/visitor.mjs.
  var nativeFetch = window.fetch;
  if (typeof nativeFetch === "function") {
    window.fetch = function (url, opt) {
      var next = opt;
      try {
        var u = typeof url === "string" ? url : "";
        if (next && typeof next.body === "string" && u.indexOf("slo-checkout") !== -1) {
          var parsed = JSON.parse(next.body);
          if (parsed && typeof parsed === "object") {
            parsed.webdriver = navigator.webdriver === true;
            var stored = read();
            if (stored.a1 && !parsed.a1) parsed.a1 = stored.a1;
            if (stored.a2 && !parsed.a2) parsed.a2 = stored.a2;
            next = {};
            for (var k in opt) next[k] = opt[k];
            next.body = JSON.stringify(parsed);
          }
        }
      } catch (e) {}
      return next === opt ? nativeFetch.apply(this, arguments) : nativeFetch.call(this, url, next);
    };
  }

  function widget() { return document.getElementById("fhw"); }
  function step1() {
    var w = widget();
    return w ? w.querySelector("form.s1") : null;
  }
  function field(form, name) {
    var el = form.querySelector('[name="' + name + '"]');
    return el ? String(el.value || "").trim() : "";
  }
  function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function isAgent(email) {
    if (navigator.webdriver === true) return true;
    var ua = navigator.userAgent || "";
    if (/HeadlessChrome|Playwright|Puppeteer|PhantomJS|Headless|bot|crawler|spider/i.test(ua)) return true;
    email = String(email || "").trim().toLowerCase();
    var at = email.lastIndexOf("@");
    if (at < 1) return false;
    var local = email.slice(0, at);
    var domain = email.slice(at + 1);
    if (domain === "fundhub.ai" || domain === "example.com" || domain === "example.net" || domain === "example.org") return true;
    return /(^|[.+_-])(e2e|sim|test)([.+_-]|$)/.test(local);
  }
  function sid() {
    var s = "";
    try { s = sessionStorage.getItem("fh_sid") || ""; } catch (e) {}
    if (!/^[A-Za-z0-9_-]{8,80}$/.test(s)) {
      s = (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
      try { sessionStorage.setItem("fh_sid", s); } catch (e2) {}
    }
    return s;
  }
  function postInterest(kind, extra, beacon) {
    if (typeof nativeFetch !== "function") return;
    var body = { kind: kind, session_id: sid(), webdriver: navigator.webdriver === true };
    var data = read();
    KEYS.concat(EXTRA).forEach(function (k) { if (data[k]) body[k] = data[k]; });
    if (extra) Object.keys(extra).forEach(function (k) { if (extra[k]) body[k] = extra[k]; });
    var payload = JSON.stringify(body);
    var url = "https://fundhub.ai/api/public/slo-interest";
    if (beacon && navigator.sendBeacon) {
      try { navigator.sendBeacon(url, new Blob([payload], { type: "text/plain" })); return; } catch (e) {}
    }
    try {
      nativeFetch.call(window, url, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: payload,
        keepalive: true
      }).catch(function () {});
    } catch (e3) {}
  }
  function phone10(v) {
    var d = String(v || "").replace(/\D/g, "");
    if (d.length === 11 && d.charAt(0) === "1") d = d.slice(1);
    return d.length === 10 ? d : "";
  }
  function sendContact(beacon) {
    var form = step1();
    if (!form) return;
    var email = field(form, "email").toLowerCase();
    if (!emailOk(email)) return;
    // Wait for a real phone. Posting on email alone used to lock the day with
    // no phone, so the unpaid follow-up text never had a number to send to.
    var phone = phone10(field(form, "phone"));
    if (!phone) return;
    var sent = "";
    // New key so an old email-only lock in this tab does not block the phone post.
    try { sent = sessionStorage.getItem("fh_contact_with_phone") || ""; } catch (e) {}
    if (sent === email) return;
    try { sessionStorage.setItem("fh_contact_with_phone", email); } catch (e2) {}
    postInterest("contact", {
      email: email,
      first_name: field(form, "c_first"),
      last_name: field(form, "c_last"),
      // Digits only — server turns this into +1XXXXXXXXXX. Raw formatting used
      // to survive the post and then get nulled if parse failed mid-type.
      phone: phone
    }, beacon);
  }
  function postRaw(body, beacon) {
    if (typeof nativeFetch !== "function" && !(beacon && navigator.sendBeacon)) return;
    var payload = JSON.stringify(body);
    var url = "https://fundhub.ai/api/public/slo-interest";
    if (beacon && navigator.sendBeacon) {
      try { navigator.sendBeacon(url, new Blob([payload], { type: "text/plain" })); return; } catch (e) {}
    }
    if (typeof nativeFetch !== "function") return;
    try {
      nativeFetch.call(window, url, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: payload,
        keepalive: true
      }).catch(function () {});
    } catch (e3) {}
  }
  if (widget()) {
    try {
      if (!sessionStorage.getItem("fh_visit_sent")) {
        sessionStorage.setItem("fh_visit_sent", "1");
        postInterest("visit", {}, false);
      }
    } catch (e) {}
    var contactTimer = null;
    document.addEventListener("input", function (ev) {
      var form = step1();
      if (!form || !form.contains(ev.target)) return;
      clearTimeout(contactTimer);
      contactTimer = setTimeout(function () { sendContact(false); }, 1500);
    });
    document.addEventListener("submit", function (ev) {
      var form = step1();
      if (form && ev.target === form) sendContact(false);
    }, true);

    /* Time on /roadmap + whether #fhw entered the viewport. One engage row
       per session on the server (upsert). Heartbeat while the tab is visible
       so a killed tab still left a number; pagehide sends the last reading. */
    var activeMs = 0;
    var lastVisibleAt = document.visibilityState === "hidden" ? 0 : Date.now();
    var reachedForm = false;
    var engagePulse = null;
    function tabVisible() { return document.visibilityState !== "hidden"; }
    function settleClock() {
      if (lastVisibleAt) {
        activeMs += Date.now() - lastVisibleAt;
        lastVisibleAt = 0;
      }
    }
    function resumeClock() {
      if (tabVisible() && !lastVisibleAt) lastVisibleAt = Date.now();
    }
    function secondsOnPage() {
      var total = activeMs;
      if (lastVisibleAt) total += Date.now() - lastVisibleAt;
      return Math.floor(total / 1000);
    }
    function sendEngage(beacon) {
      var body = {
        kind: "engage",
        session_id: sid(),
        webdriver: navigator.webdriver === true,
        seconds_on_page: secondsOnPage(),
        reached_form: reachedForm === true
      };
      var data = read();
      KEYS.concat(EXTRA).forEach(function (k) { if (data[k]) body[k] = data[k]; });
      postRaw(body, beacon);
    }
    function startEngagePulse() {
      if (engagePulse) return;
      engagePulse = setInterval(function () {
        if (tabVisible()) sendEngage(false);
      }, 30000);
    }
    function stopEngagePulse() {
      if (!engagePulse) return;
      clearInterval(engagePulse);
      engagePulse = null;
    }
    if (typeof IntersectionObserver === "function") {
      var io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            reachedForm = true;
            try { io.disconnect(); } catch (e4) {}
            break;
          }
        }
      }, { threshold: 0.05 });
      try { io.observe(widget()); } catch (e5) {}
    } else {
      reachedForm = true;
    }
    document.addEventListener("visibilitychange", function () {
      if (tabVisible()) {
        resumeClock();
        startEngagePulse();
      } else {
        settleClock();
        stopEngagePulse();
        sendEngage(true);
      }
    });
    if (tabVisible()) startEngagePulse();
    window.addEventListener("pagehide", function () {
      settleClock();
      sendContact(true);
      sendEngage(true);
    });
    document.addEventListener("click", function (ev) {
      var node = ev.target;
      var btn = null;
      while (node && node !== document) {
        if (node.getAttribute && node.getAttribute("data-pay") != null) { btn = node; break; }
        node = node.parentNode;
      }
      if (!btn || !widget() || !widget().contains(btn)) return;
      var form = step1();
      var email = form ? field(form, "email") : "";
      if (isAgent(email)) return;
      try { if (sessionStorage.getItem("fh_ic_sent")) return; sessionStorage.setItem("fh_ic_sent", "1"); } catch (e) {}
      if (typeof window.fbq !== "function") return;
      var total = widget().querySelector("[data-total]");
      var n = total ? Number(String(total.textContent || "").replace(/[^0-9.]/g, "")) : 297;
      window.fbq("track", "InitiateCheckout", { value: n > 0 ? n : 297, currency: "USD" });
    }, true);
  }

  /* Other job owns the pixel file. Load it when present; ignore a 404. */
  try {
    var rb = document.createElement("script");
    rb.src = "https://fundhub.ai/funnel/rb2b.js";
    rb.async = true;
    rb.onerror = function () {};
    (document.head || document.documentElement).appendChild(rb);
  } catch (e6) {}
})();
</script>
