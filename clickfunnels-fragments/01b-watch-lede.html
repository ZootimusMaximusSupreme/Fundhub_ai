<!-- fh-watch-lede:start v1 -->
<!--
  /watch — line under the headline (page 25061160, builder page).
  Pushed into the page's head_code as one marked block by
  scripts/cf-push-custom-html.mjs (manifest key "apply-watch-lede", strategy
  code_block_upsert). The builder body cannot be changed by API, so the new words
  are set as the page loads. The old line is hidden until then so it never flashes;
  if the script never runs, the line shows anyway after 1.5 s.
  Chris, 2026-10-01: "Find out exactly what you and your business(s) qualifies for in one call".
-->
<style>
.hero .lede:not(.fh-lede-set){visibility:hidden;animation:fhLedeShow 0s 1.5s forwards}
@keyframes fhLedeShow{to{visibility:visible}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var p = document.querySelector('.hero .lede');
  if (!p) return;
  if (p.textContent.trim() === 'Find out exactly what your business qualifies for in one call') p.textContent = 'Find out exactly what you and your businesses qualify for in one call';
  p.classList.add('fh-lede-set');
});
</script>
<!-- fh-watch-lede:end -->
