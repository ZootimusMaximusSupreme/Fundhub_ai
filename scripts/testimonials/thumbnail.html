<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fundhub testimonial thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Fundhub brand tokens — copied from clickfunnels-fragments/slo/slo-01-sales.html
   (lines 56-60). If the page's palette moves, move it here too. */
:root{
  --ink:#0A0A0A;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  /* The page's accent is a pastel spectrum. The mint stop is the one that holds
     up on both skin tones and sky, and it is already the page's "nominal" dot. */
  --accent:#A8D8B0;

  /* Set per render. The band is the soft dark wash behind the words — it is also
     what buries the caption already burned into the source video. */
  --band-top:64%;
  --band-bottom:100%;
  --foot-top:80%;
}

*{margin:0;padding:0;box-sizing:border-box}
/* 1rem == 1% of the canvas width, so one template serves every output size */
html{font-size:calc(100vw / 100)}
body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:var(--sans)}

.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* Feathered top and bottom so it never reads as a panel laid over the picture. */
.band{
  position:absolute;left:0;right:0;
  top:var(--band-top);
  bottom:calc(100% - var(--band-bottom));
  background:linear-gradient(180deg,
    rgba(10,10,10,0)     0%,
    rgba(10,10,10,.66)   9%,
    rgba(10,10,10,.985) 20%,
    rgba(10,10,10,.985) 80%,
    rgba(10,10,10,.66)  93%,
    rgba(10,10,10,0)   100%);
}

/* Small wash at the very bottom: seats the wordmark and catches any burned-in
   caption or sticker sitting below the band. */
.foot-scrim{
  position:absolute;left:0;right:0;bottom:0;
  top:var(--foot-top);
  background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,.55) 10%,rgba(10,10,10,1) 21%,rgba(10,10,10,1) 100%);
}

.block{
  position:absolute;left:0;right:0;
  top:var(--band-top);
  height:calc(var(--band-bottom) - var(--band-top));
  padding:0 6.5rem;
  display:flex;flex-direction:column;justify-content:center;
}

.kicker{
  align-self:flex-start;
  font-family:var(--mono);
  font-size:3rem;font-weight:500;
  letter-spacing:.17em;text-transform:uppercase;
  color:rgba(255,255,255,.80);
  margin-bottom:2.8rem;padding-bottom:1.6rem;
  border-bottom:.35rem solid var(--accent);
}

.headline{
  font-family:var(--sans);font-weight:800;
  font-size:11.6rem;line-height:1.02;letter-spacing:-.028em;
  color:#fff;text-wrap:balance;
  text-shadow:0 .4rem 2.4rem rgba(0,0,0,.5);
}
.headline .accent{color:var(--accent)}

/* Play button — a clean ring, nothing skeuomorphic */
.play{
  position:absolute;right:6.5rem;bottom:3.6rem;
  width:10.4rem;height:10.4rem;border-radius:50%;
  background:rgba(255,255,255,.14);
  border:.55rem solid rgba(255,255,255,.93);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 .8rem 3rem rgba(0,0,0,.35);
}
.play::after{
  content:"";
  border-left:3.5rem solid #fff;
  border-top:2.2rem solid transparent;
  border-bottom:2.2rem solid transparent;
  margin-left:1.1rem;
}

.mark{position:absolute;left:6.5rem;bottom:4.6rem;display:flex;align-items:center;gap:2.4rem}
.mark img{height:4.4rem;width:auto;display:block;filter:brightness(0) invert(1);opacity:.93}
.mark .who{
  font-family:var(--mono);font-size:2.8rem;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72);
  padding-left:2.4rem;border-left:1px solid rgba(255,255,255,.28);
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="frame" id="frame" alt="">
  <div class="band"></div>
  <div class="foot-scrim"></div>
  <div class="play" id="play"></div>
  <div class="block">
    <span class="kicker" id="kicker">Client</span>
    <h1 class="headline" id="headline">Headline goes here</h1>
  </div>
  <div class="mark">
    <img src="fundhub-wordmark.svg" alt="Fundhub">
    <span class="who" id="who"></span>
  </div>
</div>

<script>
// Params ride in on the query string so this file also opens straight in a
// browser for editing. The defaults below are only a preview.
// URLSearchParams.get() already decodes — do not decode it a second time, the
// "%" in a value like "62%" will throw.
const q = new URLSearchParams(location.search);
const d = q.get("data")
  ? JSON.parse(q.get("data"))
  : {
      frame: "../../content/testimonials/frames/colin.jpg",
      headline: "Never seen this in 12 years",
      accent: "12 years",
      kicker: "Ran a funding company",
      who: "Colin Schmidt",
      bandTop: "62%",
      bandBottom: "100%",
      playTop: "44%",
      footTop: "80%",
    };

const stage = document.getElementById("stage");
stage.style.setProperty("--band-top", d.bandTop || "64%");
stage.style.setProperty("--band-bottom", d.bandBottom || "100%");
stage.style.setProperty("--play-top", d.playTop || "50%");
stage.style.setProperty("--foot-top", d.footTop || "80%");
if (d.accentColor) stage.style.setProperty("--accent", d.accentColor);

document.getElementById("frame").src = d.frame;
document.getElementById("kicker").textContent = d.kicker || "";
document.getElementById("who").textContent = d.who || "";

// Wrap the accent words so they take the brand accent colour. Plain string
// match — the accent has to be a literal slice of the headline.
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const h = d.headline || "";
const a = d.accent || "";
const i = a ? h.indexOf(a) : -1;
document.getElementById("headline").innerHTML =
  i === -1
    ? esc(h)
    : esc(h.slice(0, i)) + '<span class="accent">' + esc(a) + "</span>" + esc(h.slice(i + a.length));

if (!d.kicker) document.getElementById("kicker").style.display = "none";
</script>
</body>
</html>
