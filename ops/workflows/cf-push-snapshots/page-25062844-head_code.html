<!-- fh-framed:start v1 -->
<!--
  /funding-book-call — FRAMED-ONLY layer (page 25062844, native AppointmentScheduler).
  Pushed into the page's head_code as one marked block by
  scripts/cf-push-custom-html.mjs (manifest key "apply-book-framed", strategy
  code_block_upsert). The body, 04a/04b and the calendar are never touched.

  Standalone visit: window.self === window.top, nothing below runs, the page is
  exactly what it was.
  Inside a frame (the $297 booking page /roadmap-book): <html> gets fh-framed,
  the page chrome hides (04a hero + logo, 04b marquee + disclaimer footer,
  every other section), the scheduler goes edge to edge with its big logo
  hidden, and the real height is posted to the parent so the frame grows to fit.
-->
<script>
(function(){
  if(window.self===window.top) return;
  document.documentElement.className+=' fh-framed';
})();
</script>
<style>
html.fh-framed,html.fh-framed body{
  height:auto!important;min-height:0!important;overflow:visible!important;
  margin:0!important;padding:0!important;background:#fff!important;
}
html.fh-framed body::before{display:none!important}

/* page chrome: 04a hero + logo, 04b marquee + footer, any section without the calendar */
html.fh-framed .fh-root,
html.fh-framed [data-page-element="CustomHtmlJs/V1"]:not(:has([data-page-element="AppointmentScheduler/V1"])),
html.fh-framed [data-page-element="SectionContainer/V1"]:not(:has([data-page-element="AppointmentScheduler/V1"])){
  display:none!important;
}

/* every wrapper around the calendar: no padding, no max-width, no card */
html.fh-framed .containerWrapper,
html.fh-framed .elPageContentWrapper,
html.fh-framed .elPageContent,
html.fh-framed [data-page-element="ContentNode"],
html.fh-framed [data-page-element="SectionContainer/V1"],
html.fh-framed .containerInnerV2,
html.fh-framed [data-page-element="RowContainer/V1"],
html.fh-framed [data-page-element="ColContainer/V1"],
html.fh-framed .col-inner{
  padding:0!important;margin:0!important;max-width:none!important;width:100%!important;
  min-height:0!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;background:transparent!important;
}

/* the calendar itself: full width, no card of its own (the parent page draws the one card) */
html.fh-framed [data-page-element="AppointmentScheduler/V1"]{
  max-width:none!important;width:100%!important;margin:0!important;padding:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif!important;
}
html.fh-framed #calContainer{
  max-width:none!important;width:100%!important;margin:0!important;
  border-radius:0!important;box-shadow:none!important;
}
/* the scheduler's big logo: the page around the frame already shows it */
html.fh-framed #calContainer > div:first-child img,
html.fh-framed #calContainer > div:first-child div:has(> img:only-child){display:none!important}
/* right panel: less dead padding so the month grid gets the room */
@media (min-width:640px){
  html.fh-framed #calContainer [class~="sm:p-12"]{padding:24px 28px!important}
  html.fh-framed #calContainer > div:first-child{padding:28px 24px!important}
  html.fh-framed #calContainer [class~="sm:text-2xl"]{font-size:22px!important;line-height:1.25!important}
  html.fh-framed #calContainer > div:first-child [class~="text-base"]{font-size:15px!important}
}
/* phone: even side gutters, name flush left, month title on one line */
@media (max-width:639px){
  html.fh-framed #calContainer > div:first-child{padding:16px 20px!important}
  html.fh-framed #calContainer [class~="ml-2"]{margin-left:0!important;margin-right:0!important}
  html.fh-framed #calContainer > div.w-full > div:first-child{padding:12px 20px!important}
  html.fh-framed #calContainer [class~="sm:p-12"]{padding:16px 6px 20px!important}
  html.fh-framed .cf2__column--left,
  html.fh-framed .cf2__column--right,
  html.fh-framed .cf2__details--tz,
  html.fh-framed .cf2__details--duration{padding-left:8px!important;padding-right:8px!important}
  html.fh-framed .cf2__calendar-header--title{font-size:20px!important;white-space:nowrap}
  html.fh-framed .cf2__time-slots-list--header h3{font-size:19px!important}
  html.fh-framed #formContainer{padding:0 14px!important}
}
/* picked-time card sits inside the panel instead of hanging off its edge */
html.fh-framed #slotInfo [class~="-m-2"]{margin:0!important}
/* times: a grid instead of one long column when there is room */
html.fh-framed .cf2__slot-list{
  display:grid!important;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;
  margin:0!important;padding:0!important;list-style:none!important;
}
html.fh-framed .cf2__slot-list--item{margin:0!important}
html.fh-framed .cf2__time-slot{width:100%!important}
/* contact form: page type and a black button instead of 30px blue links */
html.fh-framed #formContainer label{font-size:14px!important;font-weight:600!important;color:#18181B!important}
html.fh-framed #formContainer input,
html.fh-framed #formContainer textarea{border:1px solid #D4D4D8!important;border-radius:10px!important;box-shadow:none!important;font-size:16px!important}
html.fh-framed #formContainer .add-link{font-size:15px!important;font-weight:600!important;color:#0A0A0A!important}
html.fh-framed #formContainer [class~="w-4/5"]{width:100%!important}
html.fh-framed #formContainer .elBTN{display:block!important;width:100%!important}
html.fh-framed #formContainer a.elButton{
  display:block!important;width:100%!important;box-sizing:border-box!important;text-align:center!important;
  background:#0A0A0A!important;border:0!important;border-radius:10px!important;padding:14px 24px!important;color:#fff!important;
}
html.fh-framed #formContainer a.elButton .elButtonMainText{font-size:17px!important;letter-spacing:-.01em}
</style>
<script>
(function(){
  if(window.self===window.top) return;
  var PARENT='https://apply.fundhub.ai';
  // Only talk to the booking page. Framed anywhere else (a preview, the builder)
  // the look still applies but nothing is posted, so no origin-mismatch errors.
  function parentOrigin(){
    try{ return window.parent.location.origin; }catch(e){}
    try{ var a=window.location.ancestorOrigins; if(a&&a.length) return a[0]; }catch(e){}
    try{ return new URL(document.referrer).origin; }catch(e){}
    return '';
  }
  if(parentOrigin()!==PARENT) return;
  var SCHED='[data-page-element="AppointmentScheduler/V1"]';
  var last=0,lastKey='',touched=false,timer=null;
  function scrollTopNow(){ return window.pageYOffset||document.documentElement.scrollTop||0; }
  function bottomOf(el){ return el.getBoundingClientRect().bottom+scrollTopNow(); }
  function topOf(el){ return el.getBoundingClientRect().top+scrollTopNow(); }
  function shown(el){ return !!el&&el.getBoundingClientRect().height>0; }
  // What the visitor has to press next: the picked time + Confirm, or the
  // contact form + Book. Sent once each time it appears, so the booking page
  // can bring it on screen instead of leaving Confirm below the fold.
  function focusBox(){
    var c=document.querySelector('.cf2__confirm-details, .DTP__confirm-details');
    if(shown(c)) return {k:'confirm:'+(c.textContent||''),t:topOf(c),b:bottomOf(c)};
    var f=document.getElementById('formContainer');
    if(shown(f)){
      var btn=f.querySelector('a.elButton');
      return {k:'form',t:topOf(f),b:shown(btn)?bottomOf(btn):bottomOf(f)};
    }
    return null;
  }
  // never move the booking page before the visitor has touched the calendar
  function touch(){ touched=true; }
  document.addEventListener('pointerdown',touch,true);
  document.addEventListener('keydown',touch,true);
  function measure(){
    var b=document.body;
    if(!b) return 0;
    var s=document.querySelector(SCHED);
    var h=s?bottomOf(s):b.scrollHeight;
    // an open phone-country list can hang below the calendar
    var open=document.querySelectorAll('.iti__dropdown-content:not(.iti__hide)');
    for(var i=0;i<open.length;i++){ h=Math.max(h,bottomOf(open[i])+8); }
    return Math.ceil(h);
  }
  function post(){
    timer=null;
    var h=measure();
    if(!h) return;
    var msg={type:'fh-book-height',h:h};
    var fb=focusBox(),key=fb?fb.k:'';
    if(key!==lastKey){
      lastKey=key;
      if(fb&&touched) msg.focus={t:Math.floor(fb.t),b:Math.ceil(fb.b)};
    }
    if(!msg.focus&&Math.abs(h-last)<2) return;
    last=h;
    try{ window.parent.postMessage(msg,PARENT); }catch(e){}
  }
  function soon(){ if(!timer) timer=setTimeout(post,120); }
  function start(){
    soon();
    window.addEventListener('load',soon);
    window.addEventListener('resize',soon);
    if(window.ResizeObserver){ try{ new ResizeObserver(soon).observe(document.body); }catch(e){} }
    if(window.MutationObserver){
      new MutationObserver(soon).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    }
    // the calendar renders late; keep checking for its first few seconds
    var n=0,iv=setInterval(function(){ soon(); if(++n>=40) clearInterval(iv); },500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
<!-- fh-framed:end -->
<!-- fh-book-fit:start v1 -->
<!--
  /funding-book-call — STANDALONE fit layer (page 25062844, native AppointmentScheduler).
  Pushed into the page's head_code as one marked block by
  scripts/cf-push-custom-html.mjs (manifest key "apply-book-fit", strategy
  code_block_upsert), next to the fh-framed block. Body, 04a/04b and the calendar
  markup are never touched.

  Every rule starts with html:not(.fh-framed), so inside the /roadmap-book frame
  nothing here matches and 04c-book-framed.html alone decides the look.

  Every width: the scheduler's big logo stays inside its own panel (at 1280 it
  was 408px wide in a 195px panel and sat over the grey "Select a Date & Time:" band).
  Phone (under 640px, CF's own sm breakpoint): the card runs edge to edge minus
  16px gutters (was 282px of 390, month grid 168px, 24px day columns), the logo
  sits small above the meeting name, weekday names and times stay on one line.
-->
<style>
html:not(.fh-framed) #calContainer > div:first-child img{
  max-width:100%!important;height:auto!important;
}
/* the big logo used to hold the left panel at its full third; keep that split */
@media (min-width:640px){
  html:not(.fh-framed) #calContainer > div:first-child{flex-shrink:0!important}
}
@media (max-width:639px){
  /* card: 16px from each screen edge, whatever padding the CF section and row carry */
  html:not(.fh-framed) [data-page-element="AppointmentScheduler/V1"]{
    width:calc(100vw - 32px)!important;max-width:none!important;
    margin-left:calc(50% - 50vw + 16px)!important;margin-right:auto!important;
    padding:0!important;
  }
  html:not(.fh-framed) #calContainer{
    max-width:none!important;width:100%!important;margin:0!important;
    border-radius:0!important;box-shadow:none!important;
  }
  /* left panel: small logo on its own line, meeting name under it */
  html:not(.fh-framed) #calContainer > div:first-child{padding:16px!important}
  html:not(.fh-framed) #calContainer > div:first-child > div:first-child{flex-direction:column!important;align-items:flex-start!important}
  html:not(.fh-framed) #calContainer > div:first-child > div:first-child > div:first-child{max-width:100%!important;margin:0 0 10px!important}
  html:not(.fh-framed) #calContainer > div:first-child img{height:30px!important;width:auto!important;margin:0!important}
  html:not(.fh-framed) #calContainer > div:first-child [class~="ml-2"]{margin-left:0!important}
  html:not(.fh-framed) #calContainer > div:first-child [class~="text-xl"]{font-size:20px!important;line-height:1.25!important}
  html:not(.fh-framed) #calContainer > div.w-full > div:first-child{padding:12px 16px!important}
  /* the box around the date picker (two ids: CF's own #calContainer:has(#formContainer) rule sets 28px sides) */
  html:not(.fh-framed) [data-page-element="AppointmentScheduler/V1"] #calContainer [class~="sm:p-12"]:has(> #cronofy-date-time-picker){padding:16px 8px 20px!important}
  html:not(.fh-framed) .cf2__column--left,
  html:not(.fh-framed) .cf2__column--right,
  html:not(.fh-framed) .cf2__details--tz,
  html:not(.fh-framed) .cf2__details--duration{padding-left:8px!important;padding-right:8px!important}
  html:not(.fh-framed) .cf2__calendar-header--title{font-size:22px!important;white-space:nowrap}
  html:not(.fh-framed) .cf2__time-slots-list--header h3{font-size:20px!important}
}
</style>
<!-- fh-book-fit:end -->
